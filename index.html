<!doctype html>
<html lang="ro">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>VI-MP.ro</title>
    <!-- page-meta: the build writes each page's description, canonical URL, previews and structured data here (scripts/prerender.ts) -->
    <meta name="theme-color" content="#0d0b1a" />
    <link rel="icon" type="image/svg+xml" href="%BASE_URL%favicon.svg" />
  </head>
  <body>
    <!-- The build writes each prerendered page inside #root, and its bootstrap data after it. -->
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
